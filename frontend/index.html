<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Esportiva - Gerenciamento de Itens</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🏀 Loja Esportiva</h1>
    <p class="subtitle">Gerenciamento de Itens Esportivos</p>
  </header>

  <main>
    <!-- Formulário -->
    <section class="form-section">
      <h2 id="form-title">Cadastrar Novo Item</h2>
      <form id="item-form">
        <input type="hidden" id="item-id">
        <div class="form-group">
          <label for="marca">Marca *</label>
          <input type="text" id="marca" name="marca" required maxlength="100" placeholder="Ex: Nike, Adidas...">
        </div>
        <div class="form-group">
          <label for="modelo">Modelo *</label>
          <input type="text" id="modelo" name="modelo" required maxlength="100" placeholder="Ex: Air Max 90...">
        </div>
        <div class="form-group">
          <label for="preco">Preço (R$) *</label>
          <input type="number" id="preco" name="preco" required min="0" step="0.01" placeholder="Ex: 299.90">
        </div>
        <div class="form-group">
          <label for="foto">Foto (URL)</label>
          <input type="url" id="foto" name="foto" placeholder="https://exemplo.com/imagem.jpg">
        </div>
        <div class="form-actions">
          <button type="submit" id="btn-submit" class="btn btn-primary">Cadastrar</button>
          <button type="button" id="btn-cancel" class="btn btn-secondary" style="display:none;">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Mensagem -->
    <div id="message" class="message" style="display:none;"></div>

    <!-- Lista de itens -->
    <section class="items-section">
      <h2>Itens Cadastrados</h2>
      <div id="loading" class="loading">Carregando itens...</div>
      <div id="empty-state" class="empty-state" style="display:none;">
        <p>Nenhum item cadastrado ainda.</p>
        <p>Use o formulário acima para adicionar o primeiro item.</p>
      </div>
      <div id="items-grid" class="items-grid"></div>
    </section>
  </main>

  <!-- Modal de confirmação -->
  <div id="confirm-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>Confirmar Exclusão</h3>
      <p>Tem certeza que deseja excluir este item?</p>
      <p id="confirm-item-name" class="confirm-item-name"></p>
      <div class="modal-actions">
        <button id="btn-confirm-delete" class="btn btn-danger">Excluir</button>
        <button id="btn-cancel-delete" class="btn btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Loja Esportiva</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
